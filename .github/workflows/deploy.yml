name: Deploy

on:
  push:
    branches: [main]
    # The site does not read the queue or the candidates; the hits do (the
    # gallery is built from data/hits.jsonl), so those still redeploy.
    paths-ignore:
      - 'data/queue/**'
      - 'data/candidates.jsonl'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without Cloudflare credentials there is nothing to deploy to, and a run
    # that fails on a missing secret every time trains people to ignore red
    # builds. Skip cleanly instead.
    if: ${{ vars.CLOUDFLARE_PROJECT_NAME != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The engine is Rust compiled to wasm. The dictionary artifacts and
      # definition shards are committed, so no build step needs to reach
      # Hugging Face — the deploy does not depend on a third party being up.
      - name: Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # A prebuilt release binary; `cargo install wasm-pack` compiles it from
      # source and costs minutes on every cold cache.
      #
      # Pinned, never `latest`. The action looks `latest` up through the GitHub
      # API without a token, and when that call is rate limited it silently
      # installs v0.9.1, which rejects `--no-pack` in scripts/build-wasm.sh. That
      # broke the deploy of 51fea65 on 2026-09-13. Keep this in step with
      # ci.yml and with `wasm-pack --version` on the machine the build was
      # verified on.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build
        run: pnpm build

      # Wrangler is invoked directly rather than through cloudflare/wrangler-action.
      # That action installs its own copy with a bare `pnpm add wrangler@...`,
      # which pnpm refuses in a workspace root without `-w` -- so in this repo it
      # fails before it ever reaches Cloudflare, and the error it prints is about
      # pnpm rather than about the deploy. Calling the CLI is fewer moving parts,
      # matches what a manual deploy does, and takes a third-party action off the
      # critical path. Wrangler reads both credentials from the environment.
      #
      # Pinned rather than floating: this is the version the deploy was verified
      # against, and a publish step is the wrong place to pick up a surprise.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.121.0 pages deploy apps/web/dist
          --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
          --branch=main
